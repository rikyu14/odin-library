<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <title>Odin Library Project</title>
</head>
<body>
    <header>
      <h1>My Library</h1>
      <button id="new-book-btn">New Book</button>
    </header>

    <main>
      <div id="library-container"></div>
    </main>

    <dialog id="new-book-dialog">
      <form id="new-book-form">
        <h2>Add a New Book</h2>

        <label for="title">Title:</label>
        <input type="text" name="title" id="title" required />

        <label for="author">Author:</label>
        <input type="text" name="author" id="author" required />

        <label for="pages">Pages:</label>
        <input type="number" name="pages" id="pages" required />

        <label for="read">Read:</label>
        <select name="read" id="read">
          <option value="true">Read</option>
          <option value="false" selected>Not Read Yet</option>
        </select>

        <div class="form-buttons">
          <button type="submit">Add Book</button>
          <button type="button" id="cancel-btn">Cancel</button>
        </div>
      </form>
    </dialog>

  <script src="./script.js"></script>
</body>
</html>
